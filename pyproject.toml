[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-conversation-extractor"
version = "2.0.0"
description = "Extract and convert ChatGPT conversation exports into Markdown and JSON"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Sergey Lyubarskiy" },
]
keywords = ["chatgpt", "export", "markdown", "desktop-search"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
]
dependencies = [
  "PyYAML>=6.0.1",
]

[project.scripts]
chatgpt-extractor = "chatgpt_extractor.__main__:main"

[project.urls]
Homepage = "https://github.com/cs224/chatgpt-conversation-extractor"
Repository = "https://github.com/cs224/chatgpt-conversation-extractor"
Documentation = "https://weisser-zwerg.dev/posts/quick-tip-nugget-export-chatgpt-to-markdown-for-desktop-search"

[dependency-groups]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.11.1",
  "psutil>=5.9.0",
  "ruff>=0.8.0",
  "black>=23.7.0,<26.0",
  "flake8>=6.1.0",
  "mypy>=1.5.1,<2.0",
  "types-PyYAML>=6.0.0",
  "isort>=5.12.0",
  "sphinx>=7.1.0",
  "sphinx-rtd-theme>=1.3.0",
  "build>=0.10.0",
  "twine>=4.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [".uv-cache", ".venv", "build", "dist", "output", "logs"]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow",
  "performance: marks tests as performance tests",
]

[tool.uv]
cache-dir = "./.uv-cache"
